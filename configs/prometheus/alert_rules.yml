groups:
  - name: captioning
    rules:
      - alert: CaptioningAppDown
        expr: up{job="captioning-app"} == 0
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: "Captioning app /metrics is unreachable"
      - alert: HighInferenceLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(caption_inference_seconds_bucket[1m]))) > 10
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "p95 inference latency above 10 s"
      - alert: HighErrorRatio
        expr: sum(rate(caption_images_processed_total{status="error"}[2m])) / clamp_min(sum(rate(caption_images_processed_total[2m])), 1e-9) > 0.1
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "More than 10% of images fail"
  - name: host
    rules:
      - alert: HostHighCPU
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100 > 85
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "Host CPU above 85% (likely bulk upload)"
      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Host memory above 90%"
      - alert: HostDiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) * 100 > 90
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Root disk above 90%"
