global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Streamlit app. The /metrics endpoint is on its own port (28000). Prometheus connects through the compose network.
  - job_name: captioning-app
    static_configs:
      - targets: ["app:28000"]
        labels: {service: image-captioning}

  # System metrics (CPU, memory, disk) from node_exporter. Prometheus connects through the compose network.
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
        labels: {service: host}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
